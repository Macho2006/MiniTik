<!DOCTYPE html>
<html>
<head>
<title>DM Inbox - MiniTik</title>
<style>
body{background:#000;color:#fff;font-family:Arial;padding:0;margin:0}
.header{padding:20px;background:#111;display:flex;justify-content:space-between}
.header h2{color:#ff0050;margin:0}
.chat-list{padding:20px}
.chat-item{background:#111;padding:15px;margin:10px 0;border-radius:10px;display:flex;align-items:center}
.chat-item:hover{background:#222}
.chat-item a{color:#fff;text-decoration:none;font-size:18px;font-weight:bold}
.avatar{width:50px;height:50px;border-radius:50%;background:#ff0050;margin-right:15px;display:flex;align-items:center;justify-content:center;font-size:20px}
.empty{text-align:center;margin-top:100px;color:#888}
.navbar{padding:15px;text-align:center;background:#111}
.navbar a{color:#aaa;margin:0 15px;text-decoration:none}
.navbar a:hover{color:#ff0050}
</style>
</head>
<body>

<div class="header">
    <h2>💬 Messages</h2>
    <a href="/" style="color:#ff0050">Home</a>
</div>

<div class="navbar">
    <a href="/">For You</a>
    <a href="/following">Following</a>
    <a href="/trending">Trending</a>
</div>

<div class="chat-list">
{% if chats %}
    {% for c in chats %}
    <div class="chat-item">
        <div class="avatar">@</div>
        <a href="/dm/{{ c['user'] }}">@{{ c['user'] }}</a>
    </div>
    {% endfor %}
{% else %}
    <div class="empty">
        <h3>No messages yet</h3>
        <p>Go to <a href="/friends" style="color:#ff0050">Discover</a> and start a chat</p>
    </div>
{% endif %}
</div>

</body>
</html>
