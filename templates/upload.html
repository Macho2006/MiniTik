<!DOCTYPE html>
<html>
<head><title>Upload</title>
<style>
body{font-family:Arial;background:#000;color:#fff;text-align:center;padding:50px}
input, textarea, select{width:80%;padding:10px;margin:10px;border-radius:8px;border:none}
.btn{background:#ff0050;color:#fff;padding:12px 30px;border:none;border-radius:8px;cursor:pointer}
</style>
</head>
<body>
<h1>Upload Video or Picture</h1>
<form method="POST" enctype="multipart/form-data">
    <input type="file" name="file" accept="video/*,image/*" required><br>
    <textarea name="caption" placeholder="Write a caption..."></textarea><br>
    
    <label>Choose Filter:</label><br>
    <select name="filter">
        {% for f in filters %}
        <option value="{{ f }}">{{ f }}</option>
        {% endfor %}
    </select><br>
    
    <button class="btn">Post</button>
</form>
<a href="/">Back to Home</a>
</body>
</html>
